<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TWIN ORBIT · 트윈 오빗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<script src="hub-user.js"></script>
<style>
:root{
  --bg:#0d0f19; --panel:rgba(20,22,36,.92); --line:rgba(255,255,255,.09);
  --tx:#f1efe9; --tx2:#9a9cb0; --fire:#ff5b3a; --ice:#3db7ff; --acc:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.num{font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}

/* ---------- 공통 오버레이 ---------- */
.scr{position:fixed;inset:0;z-index:10;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:block}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,6,12,.62);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:400px;padding:22px 20px;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.btn{display:block;width:100%;padding:14px;border-radius:13px;font-weight:800;font-size:16px;text-align:center;margin-top:10px;background:rgba(255,255,255,.08)}
.btn.p{background:var(--acc);color:#1d1400}
.btn.row{display:flex;gap:8px}
.btns2{display:flex;gap:8px}.btns2 .btn{flex:1}
h3{font-family:'Black Han Sans';font-weight:400;font-size:24px}
.sub{color:var(--tx2);font-size:13.5px;line-height:1.5;margin-top:4px}

/* ---------- 메뉴 ---------- */
.menu-in{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.mtop{display:flex;align-items:center;gap:8px}
.back{font-size:13px;font-weight:700;color:var(--tx2);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.25)}
.me{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--line);max-width:55%}
.me i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--fire),var(--ice));flex:none}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{margin:18px 0 6px;text-align:center}
#logoCv{position:static;display:block;width:150px;height:120px;margin:0 auto 6px;touch-action:auto}
.logo h1{font-family:'Outfit';font-weight:800;font-size:clamp(40px,12vw,64px);letter-spacing:-1px;line-height:.95}
.logo h1 .f{color:var(--fire)}.logo h1 .i{color:var(--ice)}
.logo p{font-family:'Black Han Sans';font-size:17px;color:var(--tx2);margin-top:8px;letter-spacing:2px}
.vs-banner{margin-top:22px;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,rgba(255,91,58,.18),rgba(61,183,255,.18));border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:12px}
.vs-banner div{flex:1;font-size:13.5px;line-height:1.45}
.vs-banner b{font-weight:800}
.vs-banner button{background:var(--acc);color:#1d1400;font-weight:800;font-size:13px;padding:9px 13px;border-radius:10px;flex:none}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 10px}
.sec-t h2{font-family:'Black Han Sans';font-weight:400;font-size:19px}
.sec-t small{font-size:12px;color:var(--tx2)}
.lv{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px;border-radius:18px;background:rgba(18,20,34,.82);border:1px solid var(--line);margin-bottom:10px;transition:transform .12s,border-color .12s}
.lv:active{transform:scale(.985)}
@media(hover:hover){.lv:hover{border-color:rgba(255,255,255,.22)}}
.lv canvas{position:static;width:74px;height:74px;border-radius:13px;flex:none;touch-action:auto}
.lv .info{flex:1;min-width:0}
.lv .no{font-family:'Outfit';font-weight:700;font-size:11.5px;color:var(--tx2);letter-spacing:1.5px}
.lv .nm{font-family:'Black Han Sans';font-size:20px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .meta{font-size:12px;color:var(--tx2);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stars{letter-spacing:1px;color:var(--acc)}
.lv .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lv .best{font-family:'Outfit';font-weight:800;font-size:17px}
.lv .best.none{color:var(--tx2);font-size:13px;font-weight:600}
.lv .rk{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.08)}
.opts{display:flex;gap:8px;margin-top:6px}
.opt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:rgba(18,20,34,.82);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.opt .tg{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:.15s}
.opt .tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.opt.on .tg{background:var(--acc)}.opt.on .tg::after{left:17px;background:#1d1400}
.foot{font-size:12px;color:var(--tx2);text-align:center;margin-top:18px;line-height:1.6}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
#hud.on{display:block}
.htop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.hmid{flex:1;min-width:0}
#hudName{font-family:'Black Han Sans';font-size:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--ice));border-radius:9px}
#hudAcc{font-family:'Outfit';font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#hint{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));text-align:center;font-size:15px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 2px 10px rgba(0,0,0,.6);transition:opacity .4s;opacity:0}
#hint.on{opacity:1}
#vsLive{position:absolute;right:14px;top:calc(62px + env(safe-area-inset-top));font-size:12px;font-weight:700;color:var(--tx2);text-align:right}

/* ---------- 결과 ---------- */
.res-top{text-align:center}
.grade{font-family:'Outfit';font-weight:800;font-size:76px;line-height:1;background:linear-gradient(135deg,var(--fire),var(--acc) 50%,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.res-acc{font-family:'Outfit';font-weight:800;font-size:40px;margin-top:2px}
.res-acc small{font-size:16px;color:var(--tx2);font-weight:600;margin-left:4px}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;margin-top:8px}
.badge.new{background:var(--acc);color:#1d1400}
.badge.pure{background:linear-gradient(90deg,var(--fire),var(--ice));color:#fff}
.badge.nf{background:rgba(255,255,255,.1);color:var(--tx2)}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.jc{background:rgba(255,255,255,.05);border-radius:11px;padding:8px 6px;text-align:center}
.jc b{display:block;font-family:'Outfit';font-weight:800;font-size:19px}
.jc span{font-size:11px;font-weight:700}
.vsr{margin-top:14px;padding:12px;border-radius:13px;text-align:center;font-weight:800;font-size:15px}
.vsr.win{background:rgba(125,255,138,.14);color:#9dffa7}.vsr.lose{background:rgba(255,91,58,.14);color:#ffa08c}

/* ---------- 랭킹 ---------- */
.lb-tabs{display:flex;gap:6px;margin-top:14px}
.lb-tabs button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.06);color:var(--tx2)}
.lb-tabs button.on{background:var(--tx);color:#111}
.lb-list{margin-top:10px;max-height:46vh;overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)}
.lb-row .r{font-family:'Outfit';font-weight:800;width:26px;text-align:center;color:var(--tx2)}
.lb-row:nth-child(1) .r{color:#ffd166}.lb-row:nth-child(2) .r{color:#d9dde8}.lb-row:nth-child(3) .r{color:#e0a26b}
.lb-row .n{flex:1;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .a{font-family:'Outfit';font-weight:800;font-size:15px;text-align:right}
.lb-row .a small{display:block;font-size:10.5px;color:var(--tx2);font-weight:600}
.lb-row.me{background:rgba(255,209,102,.08);border-radius:10px}
.lb-empty{color:var(--tx2);font-size:13.5px;text-align:center;padding:28px 0;line-height:1.6}

/* ---------- 싱크 ---------- */
.cal-ring{width:150px;height:150px;margin:18px auto 6px;border-radius:50%;border:3px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative}
.cal-ring i{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--acc);opacity:0}
.cal-val{font-family:'Outfit';font-weight:800;font-size:34px}
.cal-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;min-height:10px}
.cal-dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.cal-dots b.on{background:var(--acc)}
.adj{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.adj button{width:44px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:#f1efe9;color:#111;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ===== 메뉴 ===== -->
<div class="scr on" id="menu">
  <div class="menu-in">
    <div class="mtop">
      <a class="back" href="hub.html">← 허브</a>
      <button class="me" id="meBtn"><i></i><span id="meName">-</span></button>
    </div>
    <div class="logo">
      <canvas id="logoCv" width="300" height="240"></canvas>
      <h1><span class="f">TWIN</span> <span class="i">ORBIT</span></h1>
      <p>트 윈 오 빗</p>
    </div>
    <div id="vsBanner"></div>
    <div class="sec-t"><h2>스테이지</h2><small>탭해서 시작 · 기록은 정확도로 겨뤄요</small></div>
    <div id="lvList"></div>
    <div class="opts">
      <button class="opt" id="calBtn">🎧 싱크 조정 <span class="num" id="offLbl" style="color:var(--tx2)">0ms</span></button>
      <button class="opt" id="nfBtn">노 페일 <span class="tg"></span></button>
    </div>
    <div class="foot">박자에 맞춰 아무 키나 누르거나 화면을 탭하세요.<br>회전 방향이 바뀌는 칸과 속도가 바뀌는 칸을 잘 보세요. 노 페일은 기록에 안 들어가요.</div>
  </div>
</div>

<!-- ===== HUD ===== -->
<div id="hud">
  <div class="htop">
    <button id="pauseBtn" aria-label="일시정지"><svg width="14" height="16" viewBox="0 0 14 16"><rect x="1" y="1" width="4" height="14" rx="1.5" fill="#fff"/><rect x="9" y="1" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
    <div class="hmid"><div id="hudName"></div><div class="prog"><i id="progBar"></i></div></div>
    <div id="hudAcc">100.00%</div>
  </div>
  <div id="vsLive"></div>
  <div id="hint"></div>
</div>

<!-- ===== 일시정지 ===== -->
<div class="ov" id="pauseOv"><div class="card">
  <h3>일시정지</h3><p class="sub">일시정지한 판은 기록에 남지 않아요.</p>
  <button class="btn p" id="resumeBtn">계속하기</button>
  <button class="btn" id="restartBtn">처음부터</button>
  <button class="btn" id="quitBtn">스테이지 선택</button>
</div></div>

<!-- ===== 실패 ===== -->
<div class="ov" id="failOv"><div class="card" style="text-align:center">
  <div class="grade" style="font-size:44px">MISSED</div>
  <p class="sub" id="failInfo"></p>
  <button class="btn p" id="failRetry">다시 하기 <span style="opacity:.6;font-weight:600">(아무 키)</span></button>
  <button class="btn" id="failQuit">스테이지 선택</button>
</div></div>

<!-- ===== 결과 ===== -->
<div class="ov" id="resOv"><div class="card" id="resCard"></div></div>

<!-- ===== 랭킹 ===== -->
<div class="ov" id="lbOv"><div class="card">
  <h3 id="lbTitle">랭킹</h3>
  <p class="sub" id="lbSub"></p>
  <div class="lb-tabs"><button data-t="online" class="on">온라인</button><button data-t="local">이 기기</button></div>
  <div class="lb-list" id="lbList"></div>
  <button class="btn" id="lbClose">닫기</button>
</div></div>

<!-- ===== 싱크 조정 ===== -->
<div class="ov" id="calOv"><div class="card" style="text-align:center">
  <h3>싱크 조정</h3>
  <p class="sub">쿵 소리에 맞춰 화면을 탭하거나 아무 키나 누르세요.<br>8번 누르면 자동으로 맞춰져요.</p>
  <div class="cal-ring" id="calRing"><i id="calPulse"></i><div><div class="cal-val num" id="calVal">0</div><div style="font-size:12px;color:var(--tx2)">ms</div></div></div>
  <div class="cal-dots" id="calDots"></div>
  <div class="adj"><button id="calM">−5</button><span class="sub" style="margin:0">직접 미세 조정</span><button id="calP">+5</button></div>
  <button class="btn p" id="calSave">저장</button>
  <div class="btns2"><button class="btn" id="calReset">0으로 초기화</button><button class="btn" id="calClose">닫기</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function show(id, on) { $(id).classList.toggle('on', on); }
function hint(s) { const h = $('hint'); if (s) { h.textContent = s; h.classList.add('on'); } else h.classList.remove('on'); }
let toastT; function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }
/* =====================================================================
   TWIN ORBIT — 두 행성 궤도 리듬 게임
   - 한 행성이 칸 위에 고정되고, 다른 행성이 그 주위를 돈다.
   - 박자에 맞춰 누르면 도는 행성이 다음 칸에 착지하고 역할이 바뀐다.
   - 칸 사이 각도 = 박자 길이 (180° = 1박). 회전 반전·속도 변화 칸 있음.
   ===================================================================== */
//@@CORE
const D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;
const angDiff = (a, b) => mod(a - b + 180, 360) - 180;
function rng32(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };

/* 채보 문법: 숫자 = 박 길이(1/3 같은 분수 가능), 숫자*n = 반복,
   [ ... ]*n = 묶음 반복, t = 다음 칸 회전 반전, x2/x.5/x1 = 행성 속도 배율 */
const LEVELS = [
  { id: 'l1', name: '첫 궤도', sub: '한 박에 한 번씩', bpm: 100, diff: 1, intro: 8, root: 57, scale: 'major', prog: [0, 4, 5, 3], chordLen: 4, energy: [1, 2, 1, 2], flow: 15, wave: 22, auto: false, seed: 11,
    theme: { bg: ['#0f1628', '#1e2b4b'], tile: '#ece5d3', done: '#56607c', deco: '#7aa2ff' },
    chart: '1*16 [1.5 .5]*4 1*8 [1 1 .5 1.5]*4 [.5 1.5]*4 1*4 [1 .5 1.5 1]*4 [1.5 .5 1 1]*4 1*8' },
  { id: 'l2', name: '흔들리는 별', sub: '엇박과 반 박', bpm: 116, diff: 2, intro: 8, root: 57, scale: 'minor', prog: [0, 5, 2, 6], chordLen: 4, energy: [1, 2, 3, 2], flow: 10, wave: 18, auto: false, seed: 23,
    theme: { bg: ['#160f29', '#32183f'], tile: '#f0e2f2', done: '#68557a', deco: '#c77dff' },
    chart: '1*8 [.75 1.25]*8 [.5 1.5]*4 [.75 .75 1.25 1.25]*4 1*4 [1.25 .75]*8 [.5 1 1.5 1]*4 [.75 1.25 .5 1.5]*4 [.75 .75 1.25 1.25]*4 1*4' },
  { id: 'l3', name: '회전목마', sub: '회전 방향 반전', bpm: 108, diff: 3, intro: 8, root: 60, scale: 'major', prog: [3, 4, 2, 5], chordLen: 4, energy: [1, 2, 2, 3], flow: 20, wave: 20, auto: true, seed: 37,
    theme: { bg: ['#0b1f1e', '#163a35'], tile: '#e6efe4', done: '#4d6a64', deco: '#5fe0c0' },
    chart: '1*8 [.5 1.5]*4 [t .5]*8 1*4 [t .5]*8 1*4 [t 1.5 .5]*4 [t .5 t .5 1]*4 [t .5]*16 [1.5 .5]*4 [t .5 t .5 t .5 t .5 1 1]*4 [t 1.5 .5]*4 [t .5]*16 1*4' },

    theme: { bg: ['#1e0f0b', '#3c1c12'], tile: '#f3e4d6', done: '#78584a', deco: '#ff8a3d' },
    chart: '1*8 [.5 1.5]*4 x2 .5*16 [.5 .5 .25 .75]*4 x1 1*4 [.75 1.25]*4 x2 [.5 .25 .75 .5]*8 .5*8 x1 [1 .5 1.5 1]*4 x.5 2*4 x1 [.5 1.5]*4 x2 .5*16 [.25 .75 .5 .5]*4 x1 1*4' },

];

function parseChart(src) {
  const toks = src.replace(/\[/g, ' [ ').replace(/\]/g, ' ] ').trim().split(/\s+/);
  let i = 0;
  const num = s => { if (s.includes('/')) { const [a, b] = s.split('/'); return +a / +b; } return +s; };
  function block() {
    const out = [];
    while (i < toks.length) {
      const t = toks[i++];
      if (t === ']') break;
      let items;
      if (t === '[') items = block();
      else if (t === 't') items = [{ k: 't' }];
      else if (t[0] === 'x') items = [{ k: 'x', v: num(t.slice(1)) }];
      else { const [n, r] = t.split('*'); items = Array.from({ length: r ? +r : 1 }, () => ({ k: 'b', v: num(n) })); }
      let rep = 1;
      if (toks[i] && toks[i][0] === '*') { rep = +toks[i].slice(1); i++; }
      for (let j = 0; j < rep; j++) out.push(...items);
    }
    return out;
  }
  return block();
}

/* 채보 → 길(각도/좌표/판정 시간) */
function buildLevel(L) {
  const notes = []; let mult = 1, flip = false;
  for (const it of parseChart(L.chart)) {
    if (it.k === 't') flip = true;
    else if (it.k === 'x') mult = it.v;
    else { notes.push({ mb: it.v, mult, flip }); flip = false; }
  }
  const N = notes.length, last = N + 1, spb = 60 / L.bpm;
  const ang = new Float64Array(last + 1), rot = new Int8Array(last + 1), mul = new Float64Array(last + 1);
  ang[0] = L.flow; rot[0] = 1; mul[0] = 1;
  const pts = [[0, 0], [Math.cos(ang[0] * D2R), Math.sin(ang[0] * D2R)]];
  const flowAt = k => L.flow + 55 * Math.sin(k / L.wave);
  const opts = (k, prevS) => {
    const n = notes[k - 1], pb = n.mb * n.mult;
    if (n.flip) return [-prevS];
    const straight = Math.abs(mod(180 * pb, 360) - 180) < 1e-6;
    if (straight || !L.auto) return [prevS];
    return [prevS, -prevS];
  };
  const nextAng = (k, prevA, s) => { const n = notes[k - 1]; return mod(prevA + 180 - s * 180 * n.mb * n.mult, 360); };
  function stepCost(k, a, s, prevS, nx, ny) {
    let c = (s !== prevS && !notes[k - 1].flip) ? 3 : 0;
    const d = angDiff(a, flowAt(k)) / 180; c += d * d * 6;
    for (let j = 0; j < pts.length - 2; j++) {
      const dx = nx - pts[j][0], dy = ny - pts[j][1], dd = dx * dx + dy * dy;
      if (dd < 0.9) c += 200; else if (dd < 2) c += 1.5;
    }

  }

    const [x, y] = pts[pts.length - 1];
    for (const s of opts(k, prevS)) {
      const a = nextAng(k, prevA, s), nx = x + Math.cos(a * D2R), ny = y + Math.sin(a * D2R);
      let c = stepCost(k, a, s, prevS, nx, ny);

      if (c < best) best = c;

    const [x, y] = pts[k];
    for (const s of opts(k, rot[k - 1])) {
      const a = nextAng(k, ang[k - 1], s), nx = x + Math.cos(a * D2R), ny = y + Math.sin(a * D2R);

  const hb = new Float64Array(last + 1); hb[1] = L.intro;
  for (let k = 1; k <= N; k++) hb[k + 1] = hb[k] + notes[k - 1].mb;
  hb[0] = 0;
  const hitT = Array.from(hb, b => b * spb);

  // 판정 범위 (ms) — 촘촘한 구간은 겹치지 않게 줄어듦
  const win = [null];
  for (let i = 1; i <= last; i++) {
    const gp = i >= 2 ? hitT[i] - hitT[i - 1] : 1, gn = i < last ? hitT[i + 1] - hitT[i] : 1;

  return { L, N, last, spb, ang, rot, mul, pts, hb, hitT, win, twirl, spd, notes };
}

/* ---------- 음악 생성 (전부 박자 단위 이벤트) ---------- */
const semis = (sc, d) => 12 * Math.floor(d / 7) + sc[mod(d, 7)];
function genMusic(B) {
  const L = B.L, sc = SCALES[L.scale], ev = [];

  // 패드
  for (let b = 0; b < lastB; b += L.chordLen) ev.push({ b, k: 'pad', n: padNotes(chordAt(b)), d: Math.min(L.chordLen, lastB - b) });
  ev.push({ b: lastB, k: 'pad', n: padNotes(0), d: 6 });
  // 리듬 파트
  for (let b = 0; b < lastB; b++) {
    const e = energyAt(b), pos = b % 4, c = chordAt(b);
    if (b >= L.intro - 4 && b < L.intro) ev.push({ b, k: 'kick', v: 0.55 });
    if (e >= 1) {

      ev.push({ b: b + 0.5, k: 'shk', v: e >= 3 ? 0.07 : 0.05 });
      if (e === 1) { if (pos === 0 || pos === 2) ev.push({ b, k: 'bass', m: bassNote(c), d: 1.9 }); }
      else if (e === 2) ev.push({ b, k: 'bass', m: bassNote(c), d: 0.92 });
      else { ev.push({ b, k: 'bass', m: bassNote(c), d: 0.46 }); ev.push({ b: b + 0.5, k: 'bass', m: bassNote(c), d: 0.42 }); }
    }
    if (e >= 2 && (pos === 1 || pos === 3)) ev.push({ b, k: 'snr', v: e >= 3 ? 0.17 : 0.13 });

  for (let s = L.intro + 32; s < lastB; s += 32) ev.push({ b: s - 2, k: 'swell', d: 2 });
  ev.push({ b: lastB, k: 'kick', v: 0.7 }); ev.push({ b: lastB, k: 'bass', m: bassNote(0), d: 4 });

    const c = chordAt(b);

    if (k === B.last) { s = mod(s, 7) <= 3 ? Math.floor(s / 7) * 7 : Math.floor(s / 7) * 7 + 7; if (s > hi) s -= 7; }

    if (s < lo) { s = lo + 1; dir = 1; phrase = 5 + Math.floor(R() * 5); }
    if (--phrase <= 0) { dir = -dir; phrase = 5 + Math.floor(R() * 6); }
    ev.push({ b, k: 'lead', m: base + semis(sc, s), d: gap });

}

/* =====================================================================

let AC = null, MASTER = null, REV = null, NOISE = null;

  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  MASTER = AC.createGain(); MASTER.gain.value = 0.85; MASTER.connect(comp); comp.connect(AC.destination);
  REV = AC.createConvolver();

function makeBus() {

function killBus(bus, fade = 0.25) {

function osc(type, f, t, end, dest, detune = 0) {

}
function noiseSrc(t, end, dest) { const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true; s.connect(dest); s.start(t, Math.random() * 1.5); s.stop(end); return s; }

const V = {
  lead(bus, t, m, d, spb) {
    const f = mtof(m), dur = clamp(d * spb * 1.5 + 0.3, 0.4, 1.7);
    const g = AC.createGain(), lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.3;
    g.connect(lp); lp.connect(bus.dry); lp.connect(bus.wet);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.15, t + 0.009); g.gain.setTargetAtTime(0, t + 0.012, dur / 4.2);
    const g2 = AC.createGain(); g2.gain.value = 0.3; g2.connect(g);
    osc('sine', f, t, t + dur + 0.3, g); osc('triangle', f, t, t + dur + 0.3, g2);
  },
  pad(bus, t, ns, d) {
    const g = AC.createGain(), lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 950; lp.Q.value = 0.4;
    g.connect(lp); lp.connect(bus.dry); lp.connect(bus.wet);
    const pk = 0.028, end = t + d;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + Math.min(0.5, d * 0.4));
    g.gain.setValueAtTime(pk, Math.max(t + 0.5, end - 0.05)); g.gain.linearRampToValueAtTime(0, end + 0.9);

  },
  bass(bus, t, m, d) {
    const f = mtof(m), g = AC.createGain(), lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.5;
    g.connect(lp); lp.connect(bus.dry);
    const end = t + d;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.2, t + 0.014);
    g.gain.setValueAtTime(0.2, Math.max(t + 0.02, end - 0.06)); g.gain.linearRampToValueAtTime(0, end);
    osc('triangle', f, t, end + 0.05, g); osc('sine', f, t, end + 0.05, g);
  },
  kick(bus, t, v) {
    // 피치가 내려가지 않는 둥근 저음 + 약한 어택
    const g = AC.createGain(); g.connect(bus.dry);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.005); g.gain.setTargetAtTime(0, t + 0.006, 0.075);

  snr(bus, t, v) {

    const g = AC.createGain(); bp.connect(g); g.connect(bus.dry); g.connect(bus.wet);

  shk(bus, t, v) {

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06, t + d); g.gain.linearRampToValueAtTime(0, t + d + 0.06);

function playEv(bus, e, t, spb) {
  switch (e.k) {
    case 'lead': V.lead(bus, t, e.m, e.d, spb); break;
    case 'pad': V.pad(bus, t, e.n, e.d * spb); break;
    case 'bass': V.bass(bus, t, e.m, e.d * spb); break;
    case 'kick': V.kick(bus, t, e.v); break;
    case 'snr': V.snr(bus, t, e.v); break;
    case 'shk': V.shk(bus, t, e.v); break;
    case 'swell': V.swell(bus, t, e.d * spb); break;
  }

/* 실제로 귀에 들리는 시점의 오디오 시계 (출력 지연 보정) */
function audCtxTime(perfMs) {
  if (AC.getOutputTimestamp) {
    const ts = AC.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0 && performance.now() - ts.performanceTime < 120)
      return ts.contextTime + (perfMs - ts.performanceTime) / 1000;
  }
  return AC.currentTime - (AC.outputLatency || 0) - (AC.baseLatency || 0) - (performance.now() - perfMs) / 1000;
}

setInterval(() => {

  while (run.evi < run.ev.length) {

function accOf(r) { return r.n ? r.sum / r.n * 100 : 100; }

function press(perfMs) {
  if (state !== 'play' || !run) return;
  const B = run.B; if (run.cur >= B.last) return;
  const t = songT(perfMs) - OFFSET / 1000;
  const i = run.cur + 1, d = (t - B.hitT[i]) * 1000, w = B.win[i];
  if (d < -w.early) { if (d > -(w.early + 260)) judge('TE', i, false, d); return; }
  if (d > w.late) return; // 다음 프레임에서 미스 처리
  const ad = Math.abs(d);

  arr.sort((a, b) => b.score - a.score); all[lv] = arr.slice(0, 30); LS.set('twinorbit_lb', all);
}
async function submitOnline(lv, rec) {
  if (!window.HubUser || !HubUser.online()) return;
  const fb = await HubUser.firebase(); if (!fb) return;
  await fb.db.ref(`hub/scores/twin-orbit/${lv}/${fb.uid}`).transaction(cur => (!cur || rec.score > cur.score) ? rec : undefined);
}
async function fetchOnline(lv) {
  if (!window.HubUser || !HubUser.online()) return null;
  const fb = await HubUser.firebase(); if (!fb) return null;
  const snap = await fb.db.ref(`hub/scores/twin-orbit/${lv}`).orderByChild('score').limitToLast(30).once('value');
  const arr = []; snap.forEach(c => { arr.push(Object.assign({}, c.val(), { me: c.key === fb.uid })); });
  return arr.reverse();
}
let lbLevel = null, lbTab = 'online';
function openLB(L) {
  lbLevel = L; lbTab = (window.HubUser && HubUser.online()) ? 'online' : 'local';
  $('lbTitle').textContent = `${L.name} 랭킹`;
  $('lbOv').classList.add('on'); renderLB();
}
async function renderLB() {
  document.querySelectorAll('.lb-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === lbTab));
  const list = $('lbList');
  if (lbTab === 'local') {
    $('lbSub').textContent = '이 기기에서 플레이한 사람들 기록이에요. 폰 하나로 돌아가며 겨뤄도 돼요.';
    rows((LS.get('twinorbit_lb', {})[lbLevel.id] || []).map(x => Object.assign({}, x, { me: x.name === myName() })));
    return;
  }
  if (!window.HubUser || !HubUser.online()) {
    $('lbSub').textContent = '';
    list.innerHTML = `<div class="lb-empty">온라인 랭킹은 hub-user.js에 Firebase 설정을 넣으면 켜져요.<br>지금은 "이 기기" 탭이나 도전장으로 겨룰 수 있어요.</div>`;
    return;
  }
  $('lbSub').textContent = '같은 허브를 쓰는 모든 친구의 최고 기록';
  list.innerHTML = '<div class="lb-empty">불러오는 중…</div>';
  try { rows(await fetchOnline(lbLevel.id) || []); }
  catch (e) { list.innerHTML = `<div class="lb-empty">불러오기 실패: ${esc(e.message || e)}</div>`; }
}
function rows(arr) {
  $('lbList').innerHTML = arr.length ? arr.map((x, i) => `<div class="lb-row ${x.me ? 'me' : ''}"><span class="r">${i + 1}</span><span class="n">${esc(x.name)}</span><span class="a num">${(+x.acc).toFixed(2)}%<small>±${(+x.err || 0).toFixed(1)}ms</small></span></div>`).join('')
    : '<div class="lb-empty">아직 기록이 없어요. 첫 기록을 남겨보세요!</div>';
}
document.querySelectorAll('.lb-tabs button').forEach(b => b.onclick = () => { lbTab = b.dataset.t; renderLB(); });
$('lbClose').onclick = () => $('lbOv').classList.remove('on');

async function shareChallenge(L, acc, valid) {
  if (!valid) { toast('노 페일·일시정지 판은 도전장을 못 보내요'); return; }
  const u = new URL(location.href); u.search = '';
  u.searchParams.set('lv', L.id); u.searchParams.set('vs', myName()); u.searchParams.set('acc', acc.toFixed(2));
  const text = `트윈 오빗 「${L.name}」 정확도 ${acc.toFixed(2)}% 넘어볼 사람?`;
  try { if (navigator.share) { await navigator.share({ title: 'TWIN ORBIT 도전장', text, url: u.toString() }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text}\n${u}`); toast('도전장 링크를 복사했어요'); } catch (e) { prompt('이 링크를 친구에게 보내세요', u.toString()); }
}

/* =====================================================================
   싱크 조정
   ===================================================================== */
let calOn = false, cal = null;
function openCal() {
  audio(); AC.resume();
  calOn = true; cal = { bus: makeBus(), start: AC.currentTime + 0.5, spb: 0.6, next: 0, taps: [], val: OFFSET };
  $('calVal').textContent = Math.round(cal.val); dots();
  $('calOv').classList.add('on');
}
function closeCal() { calOn = false; if (cal) killBus(cal.bus, 0.15); cal = null; $('calOv').classList.remove('on'); }
setInterval(() => {
  if (!calOn || !cal || AC.state !== 'running') return;
  while (cal.start + cal.next * cal.spb < AC.currentTime + 0.25) {
    const t = cal.start + cal.next * cal.spb;
    V.kick(cal.bus, t, 0.8);
    if (cal.next % 4 === 0) V.pad(cal.bus, t, [57, 64, 69], cal.spb * 4);
    cal.next++;
  }
  const ph = (audCtxTime(performance.now()) - cal.start) / cal.spb;
  if (ph > 0) { const f = ph - Math.floor(ph); const el = $('calPulse'); el.style.opacity = Math.exp(-f * 6).toFixed(3); }
}, 16);
function calTap(perfMs) {
  if (!cal) return;
  const tt = audCtxTime(perfMs) - cal.start; if (tt < -0.2) return;
  const b = Math.round(tt / cal.spb), d = (tt - b * cal.spb) * 1000;
  cal.taps.push(d);
  if (cal.taps.length > 10) cal.taps.shift();
  const use = cal.taps.slice(-8);
  if (cal.taps.length >= 3) { const s = use.slice().sort((a, b) => a - b); cal.val = s[Math.floor(s.length / 2)]; }
  $('calVal').textContent = Math.round(cal.val); dots();
}
function dots() { const n = cal ? Math.min(8, cal.taps.length) : 0; $('calDots').innerHTML = Array.from({ length: 8 }, (_, i) => `<b class="${i < n ? 'on' : ''}"></b>`).join(''); }
$('calOv').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; calTap(e.timeStamp); });
$('calM').onclick = () => { cal.val -= 5; $('calVal').textContent = Math.round(cal.val); };
$('calP').onclick = () => { cal.val += 5; $('calVal').textContent = Math.round(cal.val); };
$('calReset').onclick = () => { cal.val = 0; cal.taps = []; $('calVal').textContent = '0'; dots(); };
$('calClose').onclick = closeCal;
$('calSave').onclick = () => { OFFSET = Math.round(cal.val); LS.set('twinorbit_offset', OFFSET); closeCal(); renderMenu(); toast(`싱크 ${OFFSET}ms 저장`); };

/* =====================================================================
   메뉴
   ===================================================================== */

let VS = null;
(function parseVS() {
  const q = new URLSearchParams(location.search), lv = q.get('lv'), vs = q.get('vs'), acc = parseFloat(q.get('acc'));
  if (lv && vs && isFinite(acc) && LEVELS.some(l => l.id === lv)) VS = { lv, name: vs.slice(0, 16), acc: clamp(acc, 0, 100) };
})();

function renderMenu() {
  $('meName').textContent = myName();
  $('offLbl').textContent = `${OFFSET > 0 ? '+' : ''}${OFFSET}ms`;
  $('nfBtn').classList.toggle('on', NOFAIL);
  const bests = LS.get('twinorbit_best', {});
  if (VS) {
    const L = LEVELS.find(l => l.id === VS.lv);
    $('vsBanner').innerHTML = `<div class="vs-banner"><div><b>${esc(VS.name)}</b>님의 도전장<br>${LEVELS.indexOf(L) + 1}. ${esc(L.name)} · <b class="num">${VS.acc.toFixed(2)}%</b>를 넘어라</div><button id="vsGo">도전</button></div>`;
    $('vsGo').onclick = () => startLevel(L, VS);
  } else $('vsBanner').innerHTML = '';
  $('lvList').innerHTML = LEVELS.map((L, i) => {
    const b = bests[L.id];
    return `<button class="lv" data-i="${i}">
      <canvas width="148" height="148" data-p="${i}"></canvas>
      <div class="info"><div class="no">STAGE ${String(i + 1).padStart(2, '0')}</div><div class="nm">${esc(L.name)}</div>
      <div class="meta"><span class="stars">${'★'.repeat(L.diff)}<span style="opacity:.25">${'★'.repeat(5 - L.diff)}</span></span><span>${L.bpm} BPM</span><span>${esc(L.sub)}</span></div></div>
      <div class="rt">${b ? `<div class="best">${b.acc.toFixed(2)}%</div>` : '<div class="best none">기록 없음</div>'}<span class="rk" data-lb="${i}">랭킹</span></div>
    </button>`;
  }).join('');
  document.querySelectorAll('.lv canvas').forEach(c => preview(c, LEVELS[+c.dataset.p]));
}
$('lvList').addEventListener('click', e => {
  const lb = e.target.closest('[data-lb]'); if (lb) { e.stopPropagation(); openLB(LEVELS[+lb.dataset.lb]); return; }
  const b = e.target.closest('.lv'); if (!b) return;
  const L = LEVELS[+b.dataset.i];
  startLevel(L, VS && VS.lv === L.id ? VS : null);
});
function preview(c, L) {
  const B = getB(L), x = c.getContext('2d');
  let a = 1e9, b = -1e9, cc = 1e9, d = -1e9;
  for (const [px, py] of B.pts) { a = Math.min(a, px); b = Math.max(b, px); cc = Math.min(cc, py); d = Math.max(d, py); }
  const s = Math.min(120 / (b - a + 1), 120 / (d - cc + 1)), ox = 74 - (a + b) / 2 * s, oy = 74 + (cc + d) / 2 * s;
  const bg = x.createLinearGradient(0, 0, 148, 148); bg.addColorStop(0, L.theme.bg[0]); bg.addColorStop(1, L.theme.bg[1]);
  x.fillStyle = bg; x.fillRect(0, 0, 148, 148);
  x.lineJoin = x.lineCap = 'round'; x.lineWidth = Math.max(2, s * 0.4); x.strokeStyle = L.theme.tile; x.globalAlpha = 0.9;
  x.beginPath(); B.pts.forEach(([px, py], i) => { const X = ox + px * s, Y = oy - py * s; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.stroke();
  x.globalAlpha = 1;
  const [sx0, sy0] = B.pts[0]; x.fillStyle = FIRE; x.beginPath(); x.arc(ox + sx0 * s, oy - sy0 * s, 5, 0, 6.28); x.fill();
  const [ex, ey] = B.pts[B.last]; x.fillStyle = '#ffd166'; x.beginPath(); x.arc(ox + ex * s, oy - ey * s, 5, 0, 6.28); x.fill();
}
$('nfBtn').onclick = () => { NOFAIL = !NOFAIL; LS.set('twinorbit_nofail', NOFAIL); renderMenu(); };
$('calBtn').onclick = openCal;
$('meBtn').onclick = () => { if (window.HubUser) location.href = 'hub.html'; };
$('lbOv').addEventListener('click', e => { if (e.target.id === 'lbOv') $('lbOv').classList.remove('on'); });

if (window.HubUser) { HubUser.ensure(() => renderMenu()); HubUser.onChange(renderMenu); }
renderMenu();
</script>
